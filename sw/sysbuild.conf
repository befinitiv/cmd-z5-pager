# Board build (sysbuild): MCUboot plus the application. The emulator is built
# with --no-sysbuild and has no bootloader.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# One application slot: an update overwrites the application in place, so the
# language models keep their partition (see README, "Updates over USB").
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Partitions come from the board devicetree.
SB_CONFIG_PARTITION_MANAGER=n
