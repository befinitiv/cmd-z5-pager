# Emulator-only configuration.

# Power-on after "switch off" restarts the executable.
CONFIG_NATIVE_SIM_REBOOT=y

# GPS: Zephyr's GNSS emulator, switched on and off through device PM. The
# GNSS subsystem is marked experimental; that is known, no notice needed.
CONFIG_GNSS=y
CONFIG_WARN_EXPERIMENTAL=n
CONFIG_GNSS_EMUL_MANUAL_UPDATE=y
CONFIG_PM_DEVICE=y
