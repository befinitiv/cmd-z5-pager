# Board-only configuration.

CONFIG_I2C=y
CONFIG_PWM=y
# nPM1300 rails (display, earpiece amplifier, radio)
CONFIG_REGULATOR=y
# nPM1300 charger: enables charging at boot, measures the battery
CONFIG_SENSOR=y
# Floats in the battery readings and telemetry
CONFIG_FPU=y
# Accelerometer: used from the power phase on
CONFIG_LIS2DH=n
# Log and console over USB CDC ACM (zephyr,console), RTT stays as a second
# log backend for the J-Link
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="befi"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CMD-Z5"
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Must stay off: the CDC ACM class carries the log itself
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=y
# Boot mode for MCUboot (src/update.c): restart into USB serial recovery
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# GPS: u-blox M10 on UART0 (drivers/gnss/gps_m10.c), switched through device
# PM. The GNSS subsystem is marked experimental; that is known.
CONFIG_GNSS=y
CONFIG_WARN_EXPERIMENTAL=n
# Satellites in view with their signal strength (GSV), for the GPS screen.
CONFIG_GNSS_SATELLITES=y

# Bluetooth LE for the MeshCore app (src/ble.c): one connection, passkey
# pairing with stored bonds, frames of up to 176 bytes in one notification.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_DEVICE_NAME="MeshCore-CMD-Z5"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200
# Smaller: no GATT caching, no writable name, fewer messages.
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_BT_LOG_LEVEL_WRN=y
