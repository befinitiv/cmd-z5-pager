# Board-only configuration.

CONFIG_I2C=y
CONFIG_PWM=y
# nPM1300 rails (display, earpiece amplifier, radio)
CONFIG_REGULATOR=y
# nPM1300 charger: enables charging at boot, measures the battery
CONFIG_SENSOR=y
# Floats in the battery readings and telemetry
CONFIG_FPU=y
# Accelerometer: used from the power phase on
CONFIG_LIS2DH=n
# Log and console over USB CDC ACM (zephyr,console), RTT stays as a second
# log backend for the J-Link
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="befi"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CMD-Z5"
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Must stay off: the CDC ACM class carries the log itself
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=y
# Boot mode for MCUboot (src/update.c): restart into USB serial recovery
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# GPS: u-blox M10 on UART0 (drivers/gnss/gps_m10.c), switched through device
# PM. The GNSS subsystem is marked experimental; that is known.
CONFIG_GNSS=y
CONFIG_WARN_EXPERIMENTAL=n
