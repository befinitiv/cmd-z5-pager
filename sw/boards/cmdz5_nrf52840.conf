# Board-only configuration.

CONFIG_I2C=y
CONFIG_PWM=y
# nPM1300 rails (display, earpiece amplifier, radio)
CONFIG_REGULATOR=y
# nPM1300 charger: enables charging at boot, measures the battery
CONFIG_SENSOR=y
# State of charge from the nPM1300 measurements (needs the FPU)
CONFIG_FPU=y
CONFIG_NRF_FUEL_GAUGE=y
# Accelerometer: used from the power phase on
CONFIG_LIS2DH=n
