# MCUboot for the CMD-Z5 board: serial recovery (SMP) over USB CDC ACM.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="befi"
CONFIG_USB_DEVICE_PRODUCT="CMD-Z5 bootloader"

# Ways into recovery: the application sets the boot mode (GPREGRET1) and
# restarts; the power key is still held 10 s after switch-on; or there is no
# valid application. Switching on from ship mode already needs the key held
# about 1 s, and a person waiting for a dark device holds it longer: with
# 2 s that ended in recovery, which looks dead. MCUboot only waits while the
# key is held, so normal starts are not slower.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=10000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# boot/src/boot_hooks.c: in USB recovery a screen (the display supply is
# switched with one I2C write to the nPM1300), and back to the application
# without USB power or without a host. MCUboot leaves the rest of the PMIC
# alone (no GPIO, MFD or regulator drivers).
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_I2C=y
CONFIG_GPIO_NPM13XX=n
CONFIG_MFD_NPM13XX=n
