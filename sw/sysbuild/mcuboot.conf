# MCUboot for the CMD-Z5 board: serial recovery (SMP) over USB CDC ACM.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="befi"
CONFIG_USB_DEVICE_PRODUCT="CMD-Z5 bootloader"

# Ways into recovery: the application sets the boot mode (GPREGRET1) and
# restarts; the power key is still held 2 s after switch-on; or there is no
# valid application.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=2000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# The board devicetree enables the nPM1300 (GPIO, MFD, I2C); MCUboot leaves
# the PMIC alone.
CONFIG_GPIO_NPM13XX=n
CONFIG_MFD_NPM13XX=n
CONFIG_I2C=n
