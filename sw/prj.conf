# Common configuration for the board and the emulator.

CONFIG_INPUT=y
CONFIG_LED=y
CONFIG_LOG=y

# Settings in the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Restart (emulator power-on, fallback when the PMIC cannot enter ship mode)
CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
